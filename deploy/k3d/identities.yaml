# The service identity this Knowledge Base needs from the k3d instance's
# Keycloak, provisioned by fred-deployment-factory's `make k3d-app` before the
# sync (its bin/k3d-identities documents the format).
clients:
  # Named after the prefix it publishes under (configuration.yaml): Fred binds
  # the prefix to the first client that publishes it. values.yaml reads its
  # secret by secretKeyRef.
  - id: kb-fred.opentext
    secret: KEYCLOAK_KB_FRED_OPENTEXT_CLIENT_SECRET # pragma: allowlist secret (Secret key name, not a credential)
    grants: [app/service_agent]
